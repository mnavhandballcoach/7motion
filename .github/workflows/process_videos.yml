name: 7 Motion - Process Video

on:
  push:
    branches:
      - main

  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

# Uma corrida de cada vez: uma corrida nova espera que a atual acabe
# (não a cancela). Evita dois processamentos ao mesmo tempo.
concurrency:
  group: 7motion-process-video
  cancel-in-progress: false

jobs:
  # Verificação leve (segundos): só instala o boto3 e olha para incoming/.
  # Sem vídeos novos, o job "process" nem arranca (poupa minutos de runner).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_videos: ${{ steps.check.outputs.has_videos }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install boto3
      run: pip install boto3

    - name: Check incoming/
      id: check
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: python process/io/check_incoming.py

  process:
    needs: check
    if: needs.check.outputs.has_videos == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # Cache pip para acelerar instalações
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies (requirements.txt)
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Add project root to PYTHONPATH
      run: echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

    - name: Run processor
      env:
        B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
        B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}

        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        SMTP_HOST: ${{ secrets.SMTP_HOST }}
        SMTP_PORT: ${{ secrets.SMTP_PORT }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}

        TEAM_MODE: "color"

        # Frames anotados (JPG por frame) e labels (.txt): "0" = não gravar nem enviar.
        # O vídeo anotado e o JSON de resultados continuam a ser gerados.
        SAVE_FRAMES: "0"
        SAVE_LABELS: "0"

        # Crops de debug: "1" para analisar, "0" em produção (poupa tempo e espaço)
        DEBUG_CROPS: "0"
        DEBUG_CROPS_EVERY: "30"

        # Itens presos em processing/ há mais de X minutos vão para failed/
        STALE_PROCESSING_MINUTES: "360"

      run: |
        python process/process_video_claude.py
