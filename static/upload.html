<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>7Motion - Video Upload</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        input, button { margin: 10px 0; padding: 8px; width: 300px; }
        #progressBar {
            width: 300px;
            height: 20px;
            background: #ddd;
            margin-top: 15px;
        }
        #progressFill {
            height: 100%;
            width: 0%;
            background: #4caf50;
        }
    </style>
</head>
<body>

<h2>7Motion - beta</h2>

<label>Email:</label><br>
<input type="email" id="email" placeholder="email@example.com" required><br>

<label>Name:</label><br>
<input type="text" id="name" placeholder="User name" required><br>

<label>Start (seconds):</label><br>
<input type="number" id="start_time" placeholder="e.g. 12" required><br>

<label>Duration (seconds):</label><br>
<input type="number" id="duration" placeholder="e.g. 8" required><br>

<label>Video:</label><br>
<input type="file" id="video" accept="video/*" required><br>

<button onclick="uploadVideo()">Upload Video</button>

<div id="progressBar"><div id="progressFill"></div></div>

<p id="status"></p>

<script>

const backendUrl = "https://hb7motion-112496418363.europe-west1.run.app";

// Generate unique filename
function generateUniqueName(originalName) {
    const now = new Date();

    const date = now.toISOString().slice(0, 10); // YYYY-MM-DD
    const time = now.toTimeString().slice(0, 8).replace(/:/g, "-"); // HH-MM-SS

    const ms = now.getMilliseconds().toString().padStart(3, "0");
    const rnd = Math.floor(10000 + Math.random() * 90000);

    const ext = originalName.substring(originalName.lastIndexOf("."));

    return `${date}_${time}_${ms}_${rnd}${ext}`;
}

async function uploadVideo() {
    const file = document.getElementById("video").files[0];
    const email = document.getElementById("email").value;
    const name = document.getElementById("name").value;
    const start_time = document.getElementById("start_time").value;
    const duration = document.getElementById("duration").value;

    if (!file) {
        document.getElementById("status").innerText = "Please select a video.";
        return;
    }

    // Generate unique filename
    const uniqueName = generateUniqueName(file.name);
    const video_id = uniqueName.replace(".mp4", "").replace(".mov", "");

    const chunkSize = 5 * 1024 * 1024; // 5MB
    let offset = 0;

    while (offset < file.size) {
        const chunk = file.slice(offset, offset + chunkSize);

        const formData = new FormData();
        formData.append("chunk", chunk);
        formData.append("index", offset);
        formData.append("filename", uniqueName);
        formData.append("email", email);
        formData.append("name", name);
        formData.append("start_time", start_time);
        formData.append("duration", duration);

        const response = await fetch(`${backendUrl}/upload_chunk`, {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            document.getElementById("status").innerText = "❌ Upload error.";
            return;
        }

        offset += chunkSize;

        const percent = Math.min(offset / file.size * 100, 100);
        document.getElementById("progressFill").style.width = percent + "%";

        document.getElementById("status").innerText =
            `Uploaded: ${Math.min(offset, file.size)} / ${file.size} bytes`;
    }

    // Finalize upload
    const finishData = new FormData();
    finishData.append("video_id", video_id);

    const finishResponse = await fetch(`${backendUrl}/upload_chunk/finish`, {
        method: "POST",
        body: finishData
    });

    if (!finishResponse.ok) {
        document.getElementById("status").innerText = "❌ Error finalizing upload.";
        return;
    }

    document.getElementById("status").innerText = "✔ Upload completed!";
}

</script>

</body>
</html>
