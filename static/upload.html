<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Upload de Vídeo</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        input, button { margin: 10px 0; padding: 8px; width: 300px; }
    </style>
</head>
<body>

<h2>7Motion - beta</h2>

<label>Email:</label><br>
<input type="email" id="email" placeholder="email@example.com" required><br>

<label>Nome:</label><br>
<input type="text" id="name" placeholder="Nome do utilizador" required><br>

<label>Início (segundos):</label><br>
<input type="number" id="start_time" placeholder="Ex: 12" required><br>

<label>Duração (segundos):</label><br>
<input type="number" id="duration" placeholder="Ex: 8" required><br>

<label>Vídeo:</label><br>
<input type="file" id="video" accept="video/*" required><br>

<button onclick="uploadVideo()">Enviar Vídeo</button>

<p id="status"></p>

<script>

const backendUrl = "https://hb7motion-511221.europe-west1.run.app";

async function uploadVideo() {
    const file = document.getElementById("video").files[0];
    const email = document.getElementById("email").value;
    const name = document.getElementById("name").value;
    const start_time = document.getElementById("start_time").value;
    const duration = document.getElementById("duration").value;

    if (!file) {
        document.getElementById("status").innerText = "Escolhe um vídeo.";
        return;
    }

    const chunkSize = 5 * 1024 * 1024; // 5MB
    let offset = 0;

    while (offset < file.size) {
        const chunk = file.slice(offset, offset + chunkSize);

        const formData = new FormData();
        formData.append("chunk", chunk);
        formData.append("index", offset);
        formData.append("filename", file.name);
        formData.append("email", email);
        formData.append("name", name);
        formData.append("start_time", start_time);
        formData.append("duration", duration);

        const response = await fetch(`${backendUrl}/upload_chunk`, {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            document.getElementById("status").innerText = "❌ Erro no upload.";
            return;
        }

        offset += chunkSize;
        document.getElementById("status").innerText = `Enviado: ${Math.min(offset, file.size)} / ${file.size} bytes`;
    }

    // Finalizar upload
    await fetch(`${backendUrl}/upload_chunk?filename=${file.name}&finish=1`);

    document.getElementById("status").innerText = "✔ Upload concluído!";
}
</script>

</body>
</html>
